<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helios AI Labs Chatbot</title>

<style>
/* ---------------------------------------------------------
   ESTILOS BASE DEL WIDGET — LOS QUE YA USAS TÚ
--------------------------------------------------------- */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* Floating button */
#chatWidgetButton {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #1e88e5;
  color: white;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#chatContainer {
  position: fixed;
  bottom: 100px;
  right: 25px;
  width: 360px;
  height: 520px;
  background: #ffffff;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
}

#chatHeader {
  background: #1e88e5;
  color: #ffffff;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
}

#chatMessages {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  background: #fafafa;
}

.msg {
  max-width: 80%;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  font-size: 14px;
}

.msg.user {
  background: #d1e8ff;
  align-self: flex-end;
}

.msg.bot {
  background: #eeeeee;
  align-self: flex-start;
}

#chatForm {
  display: flex;
  padding: 10px;
  background: #fff;
}

#messageInput {
  flex: 1;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 8px;
}

#sendBtn {
  background: #1e88e5;
  color: #fff;
  margin-left: 8px;
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- BOTÓN FLOTANTE -->
<div id="chatWidgetButton">💬</div>

<!-- WIDGET -->
<div id="chatContainer">
  <div id="chatHeader">Helios<br>Asesor Inteligente de Helios AI Labs</div>
  <div id="chatMessages"></div>

  <form id="chatForm">
    <input id="messageInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off" />
    <button id="sendBtn" type="submit">Enviar</button>
  </form>
</div>

<!-- ---------------------------------------------------------
     🔥 CHATBOT COMPLETO — TODA LA LÓGICA DENTRO DEL INDEX
--------------------------------------------------------- -->
<script>
/* =========================================================
   CONFIGURACIÓN
========================================================= */
const WEBHOOK_URL = "https://heliosailabs369.app.n8n.cloud/webhook/chatbot-groq";
const READ_PAUSE_MS = 2500;

let pendingTimeouts = [];
let conversationEnded = false;

const chatContainer = document.getElementById("chatContainer");
const chatButton = document.getElementById("chatWidgetButton");
const messagesBox = document.getElementById("chatMessages");
const inputField = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let currentStep = null;
let lead = {
  title: "", name: "", surname: "",
  email: "", phone: "",
  preferredDay: "", preferredHour: "",
  lastSentHash: ""
};

/* =========================================================
   FUNCIONES DE UTILIDAD
========================================================= */
function addPendingTimeout(cb, ms) {
  const id = setTimeout(cb, ms);
  pendingTimeouts.push(id);
}
function clearPendingTimeouts() {
  pendingTimeouts.forEach(clearTimeout);
  pendingTimeouts = [];
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function addMessage(text, sender="bot") {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerHTML = escapeHtml(text);
  messagesBox.appendChild(div);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

/* =========================================================
   MOSTRAR MENÚ PRINCIPAL
========================================================= */
function showMainMenu() {
  if (conversationEnded) return;

  clearPendingTimeouts();
  addMessage(
    "Gracias por contactarnos, somos Helios AI Labs. Para proporcionarle la mejor atención ¿Cuál de las siguientes preguntas desea que respondamos para usted?",
    "bot"
  );

  addOptions([
    { text:"A) ¿Cómo funciona...?", val:"A" },
    { text:"B) Info sobre la empresa", val:"B" },
    { text:"C) ¿Por qué adoptar IA hoy?", val:"C" },
    { text:"D) Costos y ROI", val:"D" },
    { text:"E) Todas las anteriores", val:"E" }
  ]);
}

function addOptions(list) {
  list.forEach(opt=>{
    const btn = document.createElement("button");
    btn.textContent = opt.text;
    btn.style.margin = "5px";
    btn.style.padding = "8px 12px";
    btn.style.border = "1px solid #ccc";
    btn.style.borderRadius = "6px";
    btn.style.cursor = "pointer";
    btn.onclick = ()=> handleMainChoice(opt.val);
    messagesBox.appendChild(btn);
  });
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

/* =========================================================
   PARSER DE NOMBRE Y TÍTULO
========================================================= */
function parseName(raw) {
  raw = raw.trim();
  const titleRegex = /^(Dr\.?|Dra\.?|Lic\.?|Ing\.?)\s+/i;
  let title = "";
  const tmatch = raw.match(titleRegex);
  if (tmatch) {
    title = tmatch[1];
    raw = raw.replace(titleRegex, "");
  }
  const parts = raw.split(" ");
  const surname = parts.pop();
  const name = parts.join(" ");
  return { title, name, surname };
}

/* =========================================================
   ENVÍO DE LEAD AL WEBHOOK
========================================================= */
async function sendLeadPayload(extra={}, endSession=false) {
  clearPendingTimeouts();

  const payload = {
    ...lead,
    ...extra,
    timestamp: Date.now()
  };
  const hash = JSON.stringify(payload);
  if (hash === lead.lastSentHash) {
    console.log("[helios][info] Payload duplicado, no se envía.");
    return true;
  }

  lead.lastSentHash = hash;

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      addMessage("Perfecto — hemos guardado su información.", "bot");
      if (endSession) {
        conversationEnded = true;
        addMessage("La sesión ha finalizado. Gracias por contactarnos.", "bot");
      }
      return true;
    } else {
      addMessage("Error enviando la información al servidor.", "bot");
      return false;
    }
  } catch(err) {
    console.error("[helios][error] fetch:", err);
    addMessage("Error de conexión.", "bot");
    return false;
  }
}

/* =========================================================
   MANEJO DEL MENÚ A–E
========================================================= */
function handleMainChoice(option) {
  clearPendingTimeouts();

  switch(option) {
    case "A": return handleA();
    case "B": return handleB();
    case "C": return handleC();
    case "D": return handleD();
    case "E": return handleE();
  }
}

function handleA() {
  clearPendingTimeouts();
  addMessage("Para responder a su pregunta, por favor dígame: ¿En cuál de los siguientes giros se encuentra su negocio?");
  addOptions([
    { text:"Salud", val:"salud" },
    { text:"Legal", val:"legal" },
    { text:"Comercio", val:"comercio" },
    { text:"Servicios", val:"servicios" }
  ]);
}
function handleB() {
  clearPendingTimeouts();
  addMessage(
    "Nombre comercial: Helios AI Labs.\n" +
    "Corporativo Matriz: Río Lerma 232 piso 23 CDMX.\n" +
    "22 años de experiencia.\n" +
    "Garantía avalada por PROFECO.\n" +
    "Cyberseguridad y NDA.\n" +
    "WhatsApp 771 762 2360"
  );
  addPendingTimeout(showMainMenu, READ_PAUSE_MS);
}
function handleC() {
  clearPendingTimeouts();
  addMessage(
    "Adoptar IA hoy es crucial porque acelera procesos y reduce costos. "
    +"Esperar implica perder ventaja competitiva."
  );
  addPendingTimeout(showMainMenu, READ_PAUSE_MS);
}
function handleD() {
  clearPendingTimeouts();
  addMessage(
    "Los costos dependen del alcance. Muchas implementaciones recuperan la inversión en 3 meses."
  );
  addPendingTimeout(showMainMenu, READ_PAUSE_MS);
}

async function handleE() {
  clearPendingTimeouts();
  await handleA(true);
  await handleB(true);
  await handleC(true);
  await handleD(true);
  addPendingTimeout(() => {
    addMessage("Perfecto. Para agendar necesito: Teléfono, Email, Día preferido y Hora aproximada.", "bot");
    currentStep = "captureContactPack";
  }, READ_PAUSE_MS);
}

/* =========================================================
   CAPTURA DE NOMBRE Y DATOS
========================================================= */
function startNameCapture() {
  currentStep = "captureName";
  addMessage("¡Hola! Soy Helios. ¿Con quién tengo el gusto?", "bot");
}

function processUserMessage(text) {
  const msg = text.trim();
  if (!msg) return;

  // mostrar mensaje
  addMessage(msg, "user");

  if (conversationEnded) return;

  // flujo principal
  if (currentStep === "captureName") {
    const parsed = parseName(msg);
    lead.title = parsed.title;
    lead.name = parsed.name;
    lead.surname = parsed.surname;

    addMessage(`Excelente ${lead.title} ${lead.surname}. Gracias.`, "bot");
    return showMainMenu();
  }

  if (currentStep === "captureContactPack") {
    handleContactPack(msg);
    return;
  }
}

function handleContactPack(msg) {
  const emailMatch = msg.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);
  const phoneMatch = msg.match(/(\+?\d[\d\s\-]{7,15})/);

  if (emailMatch) lead.email = emailMatch[0];
  if (phoneMatch) lead.phone = phoneMatch[0].replace(/\D/g, "");

  if (lead.email && lead.phone) {
    addMessage("Enviando información...", "bot");
    sendLeadPayload({}, true);
  } else {
    addMessage("Faltan datos. Por favor incluya teléfono y correo.", "bot");
  }
}

/* =========================================================
   EVENTOS
========================================================= */
document.getElementById("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  processUserMessage(inputField.value);
  inputField.value = "";
});

chatButton.onclick = () => {
  chatContainer.style.display = "flex";
  chatButton.style.display = "none";
  startNameCapture();
};
</script>

</body>
</html>
